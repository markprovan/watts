name: Build debug APK

# Only builds when app files change on main (or when started manually).
# Tests run separately in ci.yml on the same commit.
on:
  push:
    branches: [main]
    paths:
      - lib/**
      - android/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:

jobs:
  build-apk:
    # No test APK for dependency updates from Dependabot: CI already tests them,
    # and the Release workflow builds from the tag.
    if: ${{ !(startsWith(github.event.head_commit.message, 'deps:') || contains(github.event.head_commit.message, '/dependabot/')) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: watts-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
